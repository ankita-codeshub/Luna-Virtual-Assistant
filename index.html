<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna, My virtual assistant</title>
    <link rel="shortcut icon" href="luna logo.png" type="image/gif">
    <link rel="stylesheet" href="style.css">
    <style id="face-fix">
        /* Only ONE mood sticker may be visible at a time (works even with an old style.css) */
        .image-container { position: relative; }
        .faces { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; border-radius: 50%; }
        .face { position: absolute; inset: 0; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .4s ease, visibility .4s ease; }
        .face.on { opacity: 1; visibility: visible; }
        .face img { width: 100%; height: 100%; object-fit: contain; }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a0b2e">
</head>
<body>
    <div class="main-container">
        <div class="image-container">
            <canvas id="orb" width="300" height="300"></canvas>
            <div class="faces" aria-hidden="true">
                <div class="face" data-face="sleppy">
                    <img src="faces/sleeping.gif" alt="" onerror="this.remove()">
                </div>
                <div class="face" data-face="happy">
                    <img src="faces/happy.gif" alt="">
                </div>
                <div class="face" data-face="playful">
                    <img src="faces/excited.gif" alt="" >
                </div>
                <div class="face" data-face="angry">
                    <img src="faces/angy.gif" alt="">
                </div>
                <div class="face" data-face="interesting">
                    <img src="faces/interesting.gif" alt="">
                </div>
                <div class="face" data-face="sad">
                    <img src="faces/sad.gif" alt="">
                </div>
            </div>
            <img src="luna logo.png" alt="Luna logo" id="logo">
        </div>
        <h1 class="greeting">I'm <span id="name">Luna,</span><br>Your <span id="va">Virtual Assistant</span></h1>

        <div class="interaction-area">
            <img src="voice.svg" alt="" id="voice">
            <button id="btn" type="button" aria-live="polite">
                <img src="mic1.svg" alt="" class="mic-icon">
                <span id="content">Click here to talk to me</span>
            </button>

            <div id="chat" aria-live="polite">
                <p id="userText"></p>
                <p id="lunaText"></p>
                <div id="linkArea"></div>
            </div>

            <div class="text-row">
                <input id="textInput" type="text" placeholder="…or type a command" autocomplete="off" aria-label="Type a command">
                <button id="sendBtn" type="button">Send</button>
            </div>

            <div class="opts">
                <span id="moodLabel">😊 happy</span>
                <select id="optLang" aria-label="Language">
                    <option value="en-IN">English (India)</option>
                    <option value="en-US">English (US)</option>
                    <option value="hi-IN">हिन्दी</option>
                </select>
                <button id="histBtn" type="button">History</button>
            </div>
            <ul id="history" hidden></ul>
        </div>
    </div>

    <footer>
        <p>✨ Powered by Luna Assistant ✨</p>
    </footer>

    <script async src="https://tenor.com/embed.js"></script>
    <script src="script.js"></script>
</body>
</html>
