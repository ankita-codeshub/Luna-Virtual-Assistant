<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .bar {
      animation: eq 0.7s infinite alternate ease-in-out;
      filter: url(#glow);
    }
    .bar:nth-child(1) { animation-delay: -0.4s; fill: #e07fe5; }
    .bar:nth-child(2) { animation-delay: -0.2s; fill: #b685df; }
    .bar:nth-child(3) { animation-delay: -0.6s; fill: #8d8ddc; }
    .bar:nth-child(4) { animation-delay: -0.1s; fill: #6eabec; }
    .bar:nth-child(5) { animation-delay: -0.5s; fill: #4fc3f7; }
    
    @keyframes eq {
      0% { height: 15px; y: 65px; }
      100% { height: 50px; y: 30px; }
    }
  </style>
  
  <rect x="15" y="65" width="10" height="15" rx="5" class="bar"/>
  <rect x="30" y="65" width="10" height="15" rx="5" class="bar"/>
  <rect x="45" y="65" width="10" height="15" rx="5" class="bar"/>
  <rect x="60" y="65" width="10" height="15" rx="5" class="bar"/>
  <rect x="75" y="65" width="10" height="15" rx="5" class="bar"/>
</svg>
