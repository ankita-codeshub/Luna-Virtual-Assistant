<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="28" height="28">
  <style>
    @keyframes ripple {
      0% { transform: scale(0.8); opacity: 0.6; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .wave {
      fill: none;
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 1.5;
      transform-origin: 16px 14px;
      animation: ripple 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    .wave2 { animation-delay: 1s; }
  </style>
  
  <!-- Animated sound waves -->
  <circle cx="16" cy="14" r="7" class="wave"/>
  <circle cx="16" cy="14" r="7" class="wave wave2"/>
  
  <!-- Microphone Capsule -->
  <path d="M16 4C14.3431 4 13 5.34315 13 7V15C13 16.6569 14.3431 18 16 18C17.6569 18 19 16.6569 19 15V7C19 5.34315 17.6569 4 16 4Z" fill="white"/>
  
  <!-- Stand and Base -->
  <path d="M24 14V15C24 19.4183 20.4183 23 16 23M8 14V15C8 19.4183 11.5817 23 16 23M16 23V28M11 28H21" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
